<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{-webkit-tap-highlight-color:transparent;animation:bci-page-in 0.35s ease both;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  @keyframes bci-page-in{from{opacity:0;}to{opacity:1;}}
  ::selection{background:#c9a84c;color:#16291d;}
  :focus-visible{outline:2px solid #c9a84c;outline-offset:2px;}
  :root{
    --green-dark:#16291d;--green-mid:#3d5c42;--gold:#c9a84c;--gold-light:#ddc27e;
    --cream:#fbfaf7;--cream-dark:#f0ede4;--text-dark:#16291d;--text-muted:#5c6259;--border:#dcd6c8;
    --serif-display:'Lora',Georgia,serif;
    --serif-body:'Public Sans',Arial,sans-serif;
  }
  body{font-family:var(--serif-body);background:var(--cream);color:var(--text-dark);}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;}
  nav{background:var(--green-dark);padding:0 1.5rem;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;height:calc(60px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(201,168,76,0.2);}
  .nav-logo{color:var(--gold);font-family:var(--serif-display);font-size:1.1rem;font-weight:700;letter-spacing:6px;text-decoration:none;flex-shrink:0;}
  .nav-menu-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border:1px solid rgba(201,168,76,0.3);border-radius:4px;transition:border-color 0.2s,transform 0.15s;}
  .nav-menu-btn:hover{border-color:var(--gold);}
  .nav-menu-btn:active{transform:scale(0.95);}
  .nav-menu-btn span.menu-word{font-family:var(--serif-body);font-size:0.82rem;letter-spacing:3px;color:rgba(255,255,255,0.75);text-transform:uppercase;}
  .nav-menu-btn .chevron{color:var(--gold);width:12px;height:12px;transition:transform 0.2s;}
  .nav-menu-btn.open .chevron{transform:rotate(180deg);}
  .dropdown{display:none;position:absolute;top:60px;right:0;background:var(--green-dark);border:1px solid rgba(201,168,76,0.2);border-top:none;min-width:200px;z-index:199;}
  .dropdown.open{display:block;}
  .dropdown a{display:flex;align-items:center;gap:10px;padding:0.875rem 1.25rem;color:rgba(255,255,255,0.7);text-decoration:none;font-family:var(--serif-display);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.05);transition:all 0.15s;}
  .dropdown a:last-child{border-bottom:none;}
  .dropdown a:hover{color:var(--gold);background:rgba(255,255,255,0.03);padding-left:1.5rem;}
  .dropdown a.active{color:var(--gold);}
  .dropdown a.live{color:var(--gold-light);}
  .dropdown a .d-icon{width:18px;height:18px;color:var(--gold);flex-shrink:0;}
  .dropdown a.live .d-icon{color:var(--gold-light);}
  .page-hero{background:var(--green-dark);padding:3rem 1.5rem;text-align:center;border-bottom:1px solid rgba(201,168,76,0.15);}
  .page-eyebrow{font-family:var(--serif-display);font-size:0.65rem;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:0.75rem;}
  .page-hero h1{font-family:var(--serif-display);font-size:clamp(2rem,8vw,2.8rem);color:white;letter-spacing:0.5px;font-weight:700;}
  .page-hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;}
  .page{max-width:1080px;margin:0 auto;padding:3rem 1.5rem;flex:1 0 auto;}
  .sort-control{margin-bottom:2.5rem;max-width:320px;}
  .sort-label{display:block;font-family:var(--serif-display);font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;}
  .sort-control select{width:100%;padding:0.7rem 1rem;border:1px solid var(--border);border-radius:4px;background:white;font-family:var(--serif-body);font-size:0.85rem;color:var(--text-dark);cursor:pointer;}
  .sort-control select:focus{outline:none;border-color:var(--gold);}
  .players-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;}
  .player-card{perspective:1200px;opacity:0;transform:translateY(20px);transition:opacity 0.5s ease,transform 0.5s ease;}
  .player-card.visible{opacity:1;transform:translateY(0);}
  .card-inner{display:grid;grid-template-areas:"stack";transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(.4,.2,.2,1);cursor:pointer;}
  .player-card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{grid-area:stack;background:white;border:1px solid var(--border);border-radius:4px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:box-shadow 0.2s;display:flex;flex-direction:column;}
  .card-inner:hover .card-face{box-shadow:0 6px 24px rgba(0,0,0,0.09);}
  .card-back{transform:rotateY(180deg);}
  .card-back .player-body{background:var(--green-dark);}
  .card-back .player-team.baber{color:#8ab0d4;}
  .card-back .player-team.weff{color:#8fc7a3;}
  .card-back .player-team.tbc{color:rgba(255,255,255,0.45);}
  .card-back .player-name{color:white;}
  .flip-hint{font-family:var(--serif-display);font-size:0.5rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);text-align:center;margin-top:auto;padding-top:0.6rem;}
  .card-back .flip-hint{color:rgba(255,255,255,0.4);}
  .back-bio{font-family:var(--serif-body);font-size:0.85rem;font-style:italic;color:rgba(255,255,255,0.65);line-height:1.5;margin:0.5rem 0;}
  .back-trips-label{font-family:var(--serif-display);font-size:0.52rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:0.5rem;margin-bottom:3px;}
  .back-trips{font-family:var(--serif-display);font-size:0.75rem;color:var(--gold-light);line-height:1.45;margin-bottom:0.5rem;overflow:hidden;}
  .record-stats.dark{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.15);}
  .record-stats.dark .record-cell{border-color:rgba(255,255,255,0.15);}
  .record-stats.dark .r-label{color:rgba(255,255,255,0.5);}
  .record-stats.dark .r-num{color:var(--gold-light);}
  .player-photo{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--cream-dark);}
  .player-photo-placeholder{width:100%;aspect-ratio:3/4;background:var(--green-dark);display:flex;align-items:center;justify-content:center;}
  .player-photo-placeholder .icon{width:40px;height:40px;color:rgba(201,168,76,0.3);stroke-width:1;}
  .player-photo{opacity:0;transition:opacity 0.35s ease;}
  .player-photo.photo-loaded{opacity:1;}
  @media(prefers-reduced-motion:reduce){
    .player-photo{transition:none;opacity:1;}
  }
  .player-body{padding:0.9rem 0.85rem;height:212px;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
  .player-body>*{flex-shrink:0;}
  .player-team{font-family:var(--serif-display);font-size:0.54rem;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:4px;}
  .player-team.baber{color:#1e5a8c;}
  .player-team.weff{color:#2f7d4f;}
  .player-name{font-family:var(--serif-display);font-size:0.9rem;font-weight:600;color:var(--text-dark);margin-bottom:2px;letter-spacing:0.3px;line-height:1.25;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .player-name .pname-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .player-name .flag{flex-shrink:0;font-size:0.85em;}
  .player-role{font-family:var(--serif-display);font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:0.6rem;}
  .player-bio{font-family:var(--serif-body);font-size:0.88rem;color:var(--text-muted);font-style:italic;line-height:1.5;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
  .player-hcap{display:flex;justify-content:space-between;align-items:center;margin-top:0.75rem;}
  .hcap-label{font-family:var(--serif-display);font-size:0.54rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
  .hcap-val{font-family:var(--serif-display);font-size:0.78rem;font-weight:600;color:var(--text-dark);}
  .record-stats{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-top:0.75rem;background:#fafaf7;}
  .record-cell{flex:1;text-align:center;padding:0.5rem 0.25rem;border-right:1px solid var(--border);}
  .record-cell:last-child{border-right:none;}
  .record-cell .r-label{font-family:var(--serif-display);font-size:0.5rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);display:block;}
  .record-cell .r-num{font-family:var(--serif-display);font-size:0.92rem;font-weight:700;color:var(--green-dark);display:block;margin-top:2px;}
  footer{background:#141f26;color:rgba(255,255,255,0.25);text-align:center;padding:1.5rem;font-family:var(--serif-display);font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;}
  footer span{color:var(--gold);}
  @media(max-width:900px){.players-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.players-grid{grid-template-columns:repeat(2,1fr);gap:1rem;}}
  @media(max-width:380px){.players-grid{grid-template-columns:1fr;}}
  .admin-section{max-width:500px;margin:3rem auto 0;padding:0 1.5rem;}
  .admin-toggle{display:flex;align-items:center;gap:0.75rem;cursor:pointer;padding:0.5rem 0;border-top:1px solid var(--border);padding-top:1.5rem;}
  .admin-toggle h3{font-family:var(--serif-display);font-size:0.85rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .admin-toggle .arrow{width:16px;height:16px;color:var(--text-muted);transition:transform 0.2s;margin-left:auto;}
  .admin-toggle.open .arrow{transform:rotate(180deg);}
  .admin-password-gate{background:white;border:1px solid var(--border);border-radius:6px;padding:1.5rem;text-align:center;max-width:320px;margin:1rem auto 0;}
  .admin-password-gate h4{font-family:var(--serif-display);font-size:0.9rem;letter-spacing:2px;color:var(--green-dark);margin-bottom:0.75rem;text-transform:uppercase;}
  .admin-password-gate input{width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:4px;font-size:1rem;margin-bottom:0.625rem;text-align:center;letter-spacing:4px;-webkit-appearance:none;}
  .admin-password-gate input:focus{outline:none;border-color:var(--gold);}
  .admin-password-gate button{width:100%;padding:0.875rem;background:var(--green-dark);color:var(--gold);border:none;border-radius:4px;font-family:var(--serif-display);font-size:0.85rem;letter-spacing:2px;cursor:pointer;text-transform:uppercase;}
  .admin-pw-error{color:#b0532b;font-size:0.8rem;margin-top:0.5rem;min-height:1.1em;}
  .upload-panel{display:none;background:white;border:1px solid var(--border);border-radius:6px;padding:1.5rem;margin-top:1rem;}
  .upload-panel.visible{display:block;}
  .upload-panel h4{font-family:var(--serif-display);font-size:0.85rem;letter-spacing:1px;color:var(--green-dark);margin-bottom:1rem;text-transform:uppercase;}
  .upload-panel label{display:block;font-family:var(--serif-display);font-size:0.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.4rem;margin-top:0.9rem;}
  .upload-panel label:first-of-type{margin-top:0;}
  .upload-panel select,.upload-panel input[type=file],.upload-panel input[type=text]{width:100%;padding:0.65rem;border:1px solid var(--border);border-radius:4px;font-family:var(--serif-body);font-size:0.85rem;background:white;}
  .trip-row{display:flex;align-items:center;gap:0.75rem;}
  .trip-row select{width:auto;flex:1;}
  .trip-check{display:flex;align-items:center;gap:0.4rem;font-family:var(--serif-body);font-size:0.85rem;color:var(--text-dark);white-space:nowrap;}
  .trip-check input{width:auto;}
  .upload-btn{width:100%;padding:0.875rem;background:var(--green-dark);color:var(--gold);border:none;border-radius:4px;font-family:var(--serif-display);font-size:0.8rem;letter-spacing:2px;cursor:pointer;text-transform:uppercase;margin-top:1.25rem;}
  .upload-btn:disabled{opacity:0.6;cursor:default;}
  .upload-status{font-size:0.82rem;margin-top:0.75rem;text-align:center;min-height:1.2em;}
  .upload-status.success{color:var(--green-mid);}
  .upload-status.error{color:#b0532b;}
</style>

<script>
(function(){
  document.getElementById('menu-btn').addEventListener('click',function(){
    document.getElementById('menu-btn').classList.toggle('open');
    document.getElementById('dropdown').classList.toggle('open');
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('#menu-btn')&&!e.target.closest('#dropdown')){
      document.getElementById('menu-btn').classList.remove('open');
      document.getElementById('dropdown').classList.remove('open');
    }
  });

  /* Records shown = 2026 Marbella baseline below + live results computed
     automatically from the Algarve 2027 matches in Supabase.
     Fill in the Marbella wins/losses/ties per player when you have them. */

  function flagEmoji(code){
    if(!code)return '';
    var border='style="vertical-align:middle;border-radius:2px;border:1px solid rgba(22,41,29,0.15);"';
    var special={
      england:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="20" fill="#fff"/>'
        +'<rect x="12" width="6" height="20" fill="#CE1124"/>'
        +'<rect y="7" width="30" height="6" fill="#CE1124"/>'
      +'</svg>',
      scotland:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="20" fill="#005EB8"/>'
        +'<path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>'
      +'</svg>',
      wales:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="10" fill="#fff"/>'
        +'<rect y="10" width="30" height="10" fill="#00B140"/>'
        +'<path d="M15 4 L19 10 L15 16 L11 10 Z" fill="#C8102E"/>'
      +'</svg>',
      es:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="5" fill="#AA151B"/>'
        +'<rect y="5" width="30" height="10" fill="#F1BF00"/>'
        +'<rect y="15" width="30" height="5" fill="#AA151B"/>'
      +'</svg>',
      pl:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="10" fill="#fff"/>'
        +'<rect y="10" width="30" height="10" fill="#DC143C"/>'
      +'</svg>',
      nz:'<svg width="18" height="12" viewBox="0 0 30 20" '+border+'>'
        +'<rect width="30" height="20" fill="#00247D"/>'
        +'<rect width="14" height="10" fill="#00247D"/>'
        +'<path d="M0,0 L14,10 M14,0 L0,10" stroke="#fff" stroke-width="2"/>'
        +'<rect x="6" width="2" height="10" fill="#fff"/>'
        +'<rect y="4" width="14" height="2" fill="#fff"/>'
        +'<rect x="6.6" width="0.8" height="10" fill="#CC142B"/>'
        +'<rect y="4.6" width="14" height="0.8" fill="#CC142B"/>'
        +'<circle cx="22" cy="4" r="1.3" fill="#CC142B" stroke="#fff" stroke-width="0.4"/>'
        +'<circle cx="26" cy="8" r="1.5" fill="#CC142B" stroke="#fff" stroke-width="0.4"/>'
        +'<circle cx="21" cy="12" r="1.3" fill="#CC142B" stroke="#fff" stroke-width="0.4"/>'
        +'<circle cx="25" cy="16" r="1.1" fill="#CC142B" stroke="#fff" stroke-width="0.4"/>'
      +'</svg>'
    };
    if(special[code.toLowerCase()])return special[code.toLowerCase()];
    return code.toUpperCase().replace(/./g,function(c){return String.fromCodePoint(127397+c.charCodeAt(0));});
  }

  function buildTrips(trips){
    var sorted=trips.slice().sort(function(a,b){return b.year-a.year;});
    return sorted.map(function(tr){
      return '<div>'+tr.location+', '+tr.year+(tr.role?' <strong>&mdash; '+tr.role+'</strong>':'')+'</div>';
    }).join('');
  }

  function buildRecord(w,l,t,dark){
    var total=w+l+t;
    var cls='record-stats'+(dark?' dark':'');
    if(total===0)return '<div style="font-family:var(--serif-body);font-size:0.8rem;font-style:italic;color:'+(dark?'rgba(255,255,255,0.5)':'var(--text-muted)')+';">No matches yet</div>';
    return '<div class="'+cls+'">'
      +'<div class="record-cell"><span class="r-label">Wins</span><span class="r-num">'+w+'</span></div>'
      +'<div class="record-cell"><span class="r-label">Ties</span><span class="r-num">'+t+'</span></div>'
      +'<div class="record-cell"><span class="r-label">Losses</span><span class="r-num">'+l+'</span></div>'
    +'</div>';
  }

  function sortPlayers(list,sortKey){
    list=list.slice();
    switch(sortKey){
      case 'name-desc':
        list.sort(function(a,b){return b.name.localeCompare(a.name);});
        break;
      case 'hcap-asc':
        list.sort(function(a,b){
          var av=parseFloat(a.hcap),bv=parseFloat(b.hcap);
          if(isNaN(av)&&isNaN(bv))return 0;
          if(isNaN(av))return 1;
          if(isNaN(bv))return -1;
          return av-bv;
        });
        break;
      case 'hcap-desc':
        list.sort(function(a,b){
          var av=parseFloat(a.hcap),bv=parseFloat(b.hcap);
          if(isNaN(av)&&isNaN(bv))return 0;
          if(isNaN(av))return 1;
          if(isNaN(bv))return -1;
          return bv-av;
        });
        break;
      case 'name-asc':
      default:
        list.sort(function(a,b){return a.name.localeCompare(b.name);});
    }
    return list;
  }

  function render(sortKey){
    var grid=document.getElementById('players-grid');
    grid.innerHTML='';
    var filtered=sortPlayers(players,sortKey);
    filtered.forEach(function(p,i){
      var photoHTML=p.photo
        ?'<img class="player-photo" src="'+p.photo+'" alt="'+p.name+'">'
        :'<div class="player-photo-placeholder"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></div>';
      var actionPhotoHTML=p.actionPhoto
        ?'<img class="player-photo" src="'+p.actionPhoto+'" alt="'+p.name+' action shot">'
        :'<div class="player-photo-placeholder"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg></div>';
      var card=document.createElement('div');
      card.className='player-card';
      card.innerHTML=
        '<div class="card-inner">'+
          '<div class="card-face card-front">'+
            photoHTML+
            '<div class="player-body">'+
              '<div class="player-name"><span class="pname-text">'+p.name+'</span><span class="flag">'+flagEmoji(p.country)+'</span></div>'+
              '<div class="player-hcap"><span class="hcap-label">Handicap</span><span class="hcap-val">'+p.hcap+'</span></div>'+
              '<div class="flip-hint">Tap for team, record &amp; trips</div>'+
            '</div>'+
          '</div>'+
          '<div class="card-face card-back">'+
            actionPhotoHTML+
            '<div class="player-body">'+
              '<div class="player-team '+p.team+'">'+(p.team==='baber'?'Blue Team':p.team==='weff'?'Green Team':'TBC Team')+'</div>'+
              '<div class="player-name"><span class="pname-text">'+p.name+'</span><span class="flag">'+flagEmoji(p.country)+'</span></div>'+
              (p.bio?'<div class="back-bio">'+p.bio+'</div>':'')+
              '<div class="back-trips-label">Trips</div>'+
              '<div class="back-trips">'+buildTrips(p.trips)+'</div>'+
              buildRecord(p.wins,p.losses,p.ties,true)+
              '<div class="flip-hint">Tap to flip back</div>'+
            '</div>'+
          '</div>'+
        '</div>';
      card.querySelector('.card-inner').addEventListener('click',function(){
        card.classList.toggle('flipped');
      });
      grid.appendChild(card);
      setTimeout(function(c){c.classList.add('visible');},i*60,card);
      Array.prototype.forEach.call(card.querySelectorAll('img.player-photo'),function(img){
        if(img.complete){
          img.classList.add('photo-loaded');
        } else {
          img.addEventListener('load',function(){img.classList.add('photo-loaded');});
          img.addEventListener('error',function(){img.classList.add('photo-loaded');});
        }
      });
    });
  }

  var currentSort='name-asc';

  document.getElementById('sort-select').addEventListener('change',function(){
    currentSort=this.value;
    render(currentSort);
  });

  render(currentSort);

  /* ---------- photo overrides from Supabase, uploaded via the admin panel below.
     Hardcoded photo/actionPhoto paths above stay as the fallback — a row here
     for a given player name overrides them, so photos can be added or swapped
     without ever touching this file again. ---------- */
  var SB_URL='https://ccczckdewwlpofgjigdi.supabase.co';
  var SB_KEY='sb_publishable_9ZVOAL9qqv8uaLBq-DM_iA_ODMnweui';
  var sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;

  if(sb){
    sb.from('bci_player_photos').select('*').then(function(res){
      if(res.error||!res.data||!res.data.length)return;
      res.data.forEach(function(row){
        var p=players.find(function(pl){return pl.name===row.player_name;});
        if(!p)return;
        if(row.photo_url)p.photo=row.photo_url;
        if(row.action_photo_url)p.actionPhoto=row.action_photo_url;
        if(row.hcap)p.hcap=row.hcap;
        if(row.team)p.team=row.team;
        if(row.country!=null)p.country=row.country;
        if(row.trips)p.trips=row.trips;
      });
      render(currentSort);
      if(document.getElementById('upload-panel').classList.contains('visible'))fillEditForm();
    }).catch(function(){/* overrides are best-effort — hardcoded fallbacks still show */});
  }

  /* ---------- admin: upload player photos without touching site code ---------- */
  var ADMIN_PASS='bciadmin2027';
  var adminUnlocked=false;

  function populatePlayerSelect(){
    var sel=document.getElementById('upload-player-select');
    sel.innerHTML=players.slice().sort(function(a,b){return a.name.localeCompare(b.name);})
      .map(function(p){return '<option value="'+p.name.replace(/"/g,'&quot;')+'">'+p.name+'</option>';}).join('');
  }

  function fillEditForm(){
    var name=document.getElementById('upload-player-select').value;
    var p=players.find(function(pl){return pl.name===name;});
    if(!p)return;
    document.getElementById('edit-hcap').value=(p.hcap&&p.hcap!=='TBC')?p.hcap:'';
    document.getElementById('edit-team').value=p.team||'tbc';
    document.getElementById('edit-country').value=p.country||'';
    var marbella=(p.trips||[]).find(function(t){return t.location==='Marbella'&&t.year===2026;});
    var algarve=(p.trips||[]).find(function(t){return t.location==='Algarve'&&t.year===2027;});
    document.getElementById('trip-marbella-attended').checked=!!marbella;
    document.getElementById('trip-marbella-role').value=(marbella&&marbella.role)||'';
    document.getElementById('trip-algarve-attended').checked=!!algarve;
    document.getElementById('trip-algarve-role').value=(algarve&&algarve.role)||'';
    document.getElementById('upload-face-input').value='';
    document.getElementById('upload-action-input').value='';
    document.getElementById('upload-status').textContent='';
    document.getElementById('upload-status').className='upload-status';
  }
  document.getElementById('upload-player-select').addEventListener('change',fillEditForm);

  document.getElementById('admin-toggle').addEventListener('click',function(){
    var toggle=this;
    if(!adminUnlocked){
      var g=document.getElementById('admin-password-gate');
      var willOpen=g.style.display==='none';
      g.style.display=willOpen?'block':'none';
      toggle.classList.toggle('open',willOpen);
    } else {
      var panel=document.getElementById('upload-panel');
      var willOpen=!panel.classList.contains('visible');
      panel.classList.toggle('visible',willOpen);
      toggle.classList.toggle('open',willOpen);
    }
  });

  document.getElementById('admin-pw-btn').addEventListener('click',function(){
    var v=document.getElementById('admin-pw-input').value;
    if(v===ADMIN_PASS){
      adminUnlocked=true;
      document.getElementById('admin-password-gate').style.display='none';
      document.getElementById('upload-panel').classList.add('visible');
      document.getElementById('admin-toggle').classList.add('open');
      populatePlayerSelect();
      fillEditForm();
    } else {
      document.getElementById('admin-pw-error').textContent='Incorrect password.';
    }
  });
  document.getElementById('admin-pw-input').addEventListener('keydown',function(e){
    if(e.key==='Enter')document.getElementById('admin-pw-btn').click();
  });

  document.getElementById('upload-btn').addEventListener('click',function(){
    if(!sb){alert('Not connected — try reloading the page.');return;}
    var name=document.getElementById('upload-player-select').value;
    var faceFile=document.getElementById('upload-face-input').files[0];
    var actionFile=document.getElementById('upload-action-input').files[0];
    var statusEl=document.getElementById('upload-status');
    var btn=this;
    btn.disabled=true;btn.textContent='Saving...';
    statusEl.textContent='';statusEl.className='upload-status';

    var slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

    function uploadOne(file,suffix){
      var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      var path=slug+'-'+suffix+'-'+Date.now()+'.'+ext;
      return sb.storage.from('player-photos').upload(path,file,{upsert:true})
        .then(function(res){
          if(res.error)throw new Error(res.error.message);
          return sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
        });
    }

    var faceP=faceFile?uploadOne(faceFile,'face'):Promise.resolve(null);
    var actionP=actionFile?uploadOne(actionFile,'action'):Promise.resolve(null);

    Promise.all([faceP,actionP]).then(function(urls){
      var trips=[];
      if(document.getElementById('trip-marbella-attended').checked){
        var mRole=document.getElementById('trip-marbella-role').value;
        var mTrip={location:'Marbella',year:2026};
        if(mRole)mTrip.role=mRole;
        trips.push(mTrip);
      }
      if(document.getElementById('trip-algarve-attended').checked){
        var aRole=document.getElementById('trip-algarve-role').value;
        var aTrip={location:'Algarve',year:2027};
        if(aRole)aTrip.role=aRole;
        trips.push(aTrip);
      }
      var hcapVal=document.getElementById('edit-hcap').value.trim();
      var teamVal=document.getElementById('edit-team').value;
      var countryVal=document.getElementById('edit-country').value;
      var update={
        player_name:name,
        updated_at:new Date().toISOString(),
        hcap:hcapVal||'TBC',
        team:teamVal,
        country:countryVal,
        trips:trips
      };
      if(urls[0])update.photo_url=urls[0];
      if(urls[1])update.action_photo_url=urls[1];
      return sb.from('bci_player_photos').upsert(update,{onConflict:'player_name'}).then(function(res){
        return {res:res,update:update};
      });
    }).then(function(result){
      btn.disabled=false;btn.textContent='Save Changes';
      if(result.res.error){
        statusEl.textContent='Could not save: '+result.res.error.message;
        statusEl.className='upload-status error';
        return;
      }
      // reflect the change immediately, rather than needing a page refresh to see it
      var p=players.find(function(pl){return pl.name===name;});
      if(p){
        p.hcap=result.update.hcap;
        p.team=result.update.team;
        p.country=result.update.country;
        p.trips=result.update.trips;
        if(result.update.photo_url)p.photo=result.update.photo_url;
        if(result.update.action_photo_url)p.actionPhoto=result.update.action_photo_url;
        render(currentSort);
      }
      statusEl.textContent='Saved.';
      statusEl.className='upload-status success';
      document.getElementById('upload-face-input').value='';
      document.getElementById('upload-action-input').value='';
    }).catch(function(err){
      btn.disabled=false;btn.textContent='Save Changes';
      statusEl.textContent='Save failed: '+(err&&err.message?err.message:'unknown error');
      statusEl.className='upload-status error';
    });
  });

  /* ---------- live records from the 2027 leaderboard ---------- */
  var SB_URL='https://ccczckdewwlpofgjigdi.supabase.co';
  var SB_KEY='sb_publishable_9ZVOAL9qqv8uaLBq-DM_iA_ODMnweui';

  fetch(SB_URL+'/rest/v1/bci_matches?select=status,leader,baber_players,weff_players',{
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}
  })
  .then(function(r){return r.json();})
  .then(function(rows){
    if(!Array.isArray(rows))return;
    /* Only finished matches count, and placeholder fixtures
       (e.g. "Baber Pair 1", "Weff Player 4") are ignored. */
    var finals=rows.filter(function(m){
      return m.status==='final'&&!/\b(pair|player)\s*\d/i.test(m.baber_players+' '+m.weff_players);
    });
    if(!finals.length)return;
    players.forEach(function(p){
      var re=new RegExp('\\b'+p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      finals.forEach(function(m){
        var side=re.test(m.baber_players)?'baber':(re.test(m.weff_players)?'weff':null);
        if(!side)return;
        if(m.leader==='tie')p.ties++;
        else if(m.leader===side)p.wins++;
        else p.losses++;
      });
    });
    render(currentSort);
  })
  .catch(function(){/* leaderboard unreachable — baseline records still show */});
})();
