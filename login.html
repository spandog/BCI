<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In — Book Club Invitational</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#16291d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BCI">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-coastal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{-webkit-tap-highlight-color:transparent;animation:bci-page-in 0.35s ease both;}
  @keyframes bci-page-in{from{opacity:0;}to{opacity:1;}}
  ::selection{background:#c9a84c;color:#16291d;}
  :focus-visible{outline:2px solid #c9a84c;outline-offset:2px;}
  :root{
    --green-dark:#16291d;--green-mid:#3d5c42;--gold:#c9a84c;--gold-light:#ddc27e;
    --cream:#fbfaf7;--cream-dark:#f0ede4;--text-dark:#16291d;--text-muted:#5c6259;--border:#dcd6c8;
    --serif-display:'Lora',Georgia,serif;
    --serif-body:'Public Sans',Arial,sans-serif;
  }
  body{font-family:var(--serif-body);background:var(--cream);color:var(--text-dark);min-height:100vh;display:flex;flex-direction:column;}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;}
  nav{background:var(--green-dark);padding:0 1.5rem;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;height:calc(60px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(201,168,76,0.2);}
  .nav-logo{color:var(--gold);font-family:var(--serif-display);font-size:1.1rem;font-weight:700;letter-spacing:6px;text-decoration:none;flex-shrink:0;}

  .page{max-width:420px;margin:0 auto;padding:3rem 1.5rem;flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;}
  .login-eyebrow{font-family:var(--serif-display);font-size:0.62rem;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:0.5rem;text-align:center;}
  .login-title{font-family:var(--serif-display);font-size:1.9rem;font-weight:700;color:var(--text-dark);text-align:center;margin-bottom:0.5rem;}
  .login-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;}
  .login-sub{font-family:var(--serif-body);font-size:0.9rem;color:var(--text-muted);text-align:center;margin-bottom:2rem;line-height:1.5;}

  .login-card{background:white;border:1px solid var(--border);border-radius:8px;padding:1.75rem 1.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  .login-label{display:block;font-family:var(--serif-display);font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;}
  .login-card input{width:100%;padding:0.8rem 0.9rem;border:1px solid var(--border);border-radius:6px;font-family:var(--serif-body);font-size:0.95rem;background:#fafaf7;margin-bottom:1rem;}
  .login-card input:focus{outline:none;border-color:var(--gold);background:white;}
  .login-btn{width:100%;padding:0.85rem;background:var(--green-dark);color:var(--gold);border:none;border-radius:6px;font-family:var(--serif-display);font-size:0.72rem;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;cursor:pointer;transition:background 0.15s;}
  .login-btn:hover{background:#182530;}
  .login-btn:disabled{opacity:0.6;cursor:default;}

  .login-status{margin-top:1rem;text-align:center;font-family:var(--serif-body);font-size:0.85rem;color:var(--text-muted);line-height:1.5;min-height:1.2em;}
  .login-status.success{color:var(--green-mid);}
  .login-status.error{color:#b0532b;}

  .signed-in-card{background:white;border:1px solid var(--border);border-radius:8px;padding:1.75rem 1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  .signed-in-name{font-family:var(--serif-display);font-size:1.3rem;font-weight:700;color:var(--text-dark);margin-bottom:0.35rem;}
  .signed-in-email{font-family:var(--serif-body);font-size:0.82rem;color:var(--text-muted);margin-bottom:1.25rem;}
  .signed-in-links{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.25rem;}
  .signed-in-links a{display:block;padding:0.75rem;border:1px solid var(--border);border-radius:6px;text-align:center;text-decoration:none;font-family:var(--serif-display);font-size:0.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dark);transition:border-color 0.15s;}
  .signed-in-links a:hover{border-color:var(--gold);}
  .signout-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:0.65rem;width:100%;font-family:var(--serif-body);font-size:0.8rem;color:var(--text-muted);cursor:pointer;}
  .signout-btn:hover{border-color:#b0532b;color:#b0532b;}

  footer{background:#141f26;color:rgba(255,255,255,0.25);text-align:center;padding:1.5rem;font-family:var(--serif-display);font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;}
  footer span{color:var(--gold);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">BCI</a>
</nav>

<div class="page">
  <div class="login-eyebrow">Book Club Invitational</div>
  <h1 class="login-title">Sign In</h1>
  <p class="login-sub">Used for betting, kit orders, and settling up. One link sent to your email, no password to remember.</p>

  <div id="login-view">
    <div class="login-card">
      <label class="login-label" for="email-input">Email address</label>
      <input type="email" id="email-input" placeholder="you@email.com" autocomplete="email">
      <button class="login-btn" id="send-link-btn">Send Me A Login Link</button>
      <div class="login-status" id="login-status"></div>
    </div>
  </div>

  <div id="signed-in-view" style="display:none;">
    <div class="signed-in-card">
      <div class="signed-in-name" id="signed-in-name"></div>
      <div class="signed-in-email" id="signed-in-email"></div>
      <div class="signed-in-links">
        <a href="leaderboard.html">Leaderboard</a>
        <a href="kit.html">BCI Shop</a>
      </div>
      <button class="signout-btn" id="signout-btn">Sign Out</button>
    </div>
  </div>
</div>

<footer><p><span>Book Club Invitational</span></p></footer>

<script>
(function(){
  var SUPABASE_URL='https://ccczckdewwlpofgjigdi.supabase.co';
  var SUPABASE_ANON_KEY='sb_publishable_9ZVOAL9qqv8uaLBq-DM_iA_ODMnweui';
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

  function showStatus(msg,cls){
    var el=document.getElementById('login-status');
    el.textContent=msg;
    el.className='login-status'+(cls?(' '+cls):'');
  }

  function showSignedIn(user){
    document.getElementById('login-view').style.display='none';
    document.getElementById('signed-in-view').style.display='block';
    document.getElementById('signed-in-email').textContent=user.email;
    sb.from('bci_profiles').select('name').eq('id',user.id).single().then(function(res){
      document.getElementById('signed-in-name').textContent=(res.data&&res.data.name)?res.data.name:'Welcome';
    });
  }

  sb.auth.getSession().then(function(res){
    if(res.data&&res.data.session)showSignedIn(res.data.session.user);
  });

  sb.auth.onAuthStateChange(function(event,session){
    if(session&&session.user)showSignedIn(session.user);
  });

  document.getElementById('send-link-btn').addEventListener('click',function(){
    var email=document.getElementById('email-input').value.trim();
    if(!email||email.indexOf('@')===-1){showStatus('Enter a valid email address.','error');return;}
    var btn=this;
    btn.disabled=true;btn.textContent='Sending...';
    showStatus('');
    sb.auth.signInWithOtp({
      email:email,
      options:{emailRedirectTo:window.location.href}
    }).then(function(res){
      btn.disabled=false;btn.textContent='Send Me A Login Link';
      if(res.error){
        showStatus('Could not send the link: '+res.error.message,'error');
      } else {
        showStatus('Check your email — tap the link there to sign in on this device.','success');
      }
    });
  });

  document.getElementById('signout-btn').addEventListener('click',function(){
    sb.auth.signOut().then(function(){
      window.location.reload();
    });
  });
})();
</script>
<script src="bci-features.js"></script>
</body>
</html>
