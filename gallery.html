<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{-webkit-tap-highlight-color:transparent;animation:bci-page-in 0.35s ease both;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  @keyframes bci-page-in{from{opacity:0;}to{opacity:1;}}
  ::selection{background:#c9a84c;color:#16291d;}
  :focus-visible{outline:2px solid #c9a84c;outline-offset:2px;}
  :root{
    --green-dark:#16291d;--green-mid:#3d5c42;--gold:#c9a84c;--gold-light:#ddc27e;
    --cream-dark:#f0ede4;--text-dark:#16291d;--text-muted:#5c6259;--border:#dcd6c8;
    --serif-display:'Lora',Georgia,serif;
    --serif-body:'Public Sans',Arial,sans-serif;
  }
  body{font-family:var(--serif-body);background:var(--cream-dark);color:var(--text-dark);}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;}
  nav{background:var(--green-dark);padding:0 1.5rem;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;height:calc(60px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(201,168,76,0.2);}
  .nav-logo{color:var(--gold);font-family:var(--serif-display);font-size:1.1rem;font-weight:700;letter-spacing:6px;text-decoration:none;flex-shrink:0;}
  .nav-menu-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border:1px solid rgba(201,168,76,0.3);border-radius:4px;transition:border-color 0.2s,transform 0.15s;}
  .nav-menu-btn:active{transform:scale(0.95);}
  .nav-menu-btn:hover{border-color:var(--gold);}
  .nav-menu-btn span.menu-word{font-family:var(--serif-body);font-size:0.82rem;letter-spacing:3px;color:rgba(255,255,255,0.75);text-transform:uppercase;}
  .nav-menu-btn .chevron{color:var(--gold);width:12px;height:12px;transition:transform 0.2s;}
  .nav-menu-btn.open .chevron{transform:rotate(180deg);}
  .dropdown{display:none;position:absolute;top:60px;right:0;background:var(--green-dark);border:1px solid rgba(201,168,76,0.2);border-top:none;min-width:200px;z-index:199;}
  .dropdown.open{display:block;}
  .dropdown a{display:flex;align-items:center;gap:10px;padding:0.875rem 1.25rem;color:rgba(255,255,255,0.7);text-decoration:none;font-family:var(--serif-display);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.05);transition:all 0.15s;}
  .dropdown a:last-child{border-bottom:none;}
  .dropdown a:hover{color:var(--gold);background:rgba(255,255,255,0.03);padding-left:1.5rem;}
  .dropdown a.active{color:var(--gold);}
  .dropdown a.live{color:var(--gold-light);}
  .dropdown a .d-icon{width:18px;height:18px;color:var(--gold);flex-shrink:0;}
  .dropdown a.live .d-icon{color:var(--gold-light);}

  .page-hero{background:var(--green-dark);padding:3rem 1.5rem;text-align:center;border-bottom:1px solid rgba(201,168,76,0.15);}
  .page-eyebrow{font-family:var(--serif-display);font-size:0.65rem;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:0.75rem;}
  .page-hero h1{font-family:var(--serif-display);font-size:clamp(2rem,8vw,2.8rem);color:white;letter-spacing:0.5px;font-weight:700;}
  .page-hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;}

  .page{max-width:1080px;margin:0 auto;padding:2.5rem 1.5rem;flex:1 0 auto;}
  .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
  .skeleton-tile{aspect-ratio:1;border-radius:6px;
    background:linear-gradient(90deg,#eee 25%,#f6f6f6 37%,#eee 63%);
    background-size:400% 100%;animation:bci-shimmer 1.4s ease infinite;}
  @keyframes bci-shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
  @media(prefers-reduced-motion:reduce){
    .skeleton-tile{animation:none;background:#eee;}
  }
  .submit-photo-wrap{text-align:center;margin-bottom:2.5rem;}
  .submit-photo-btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--green-dark);color:var(--gold);border:none;border-radius:4px;padding:0.75rem 1.5rem;font-family:var(--serif-display);font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background 0.2s;}
  .submit-photo-btn:hover{background:var(--green-mid);}
  .submit-photo-btn .icon{width:16px;height:16px;}
  .gallery-section-title{font-family:var(--serif-display);font-size:0.65rem;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border);}
  .gallery-section{margin-bottom:3rem;}
  figure.plate{opacity:0;transform:translateY(24px);transition:opacity 0.5s ease,transform 0.5s ease;}
  figure.plate.visible{opacity:1;transform:translateY(0);}
  .frame{background:#fff;padding:8px;border:1px solid var(--gold);box-shadow:0 2px 14px rgba(0,0,0,0.10);transition:box-shadow 0.3s;}
  figure.plate:hover .frame{box-shadow:0 8px 28px rgba(0,0,0,0.20);}
  .gallery-img{aspect-ratio:4/3;object-fit:cover;width:100%;display:block;cursor:pointer;}
  .gallery-vid{aspect-ratio:4/3;object-fit:cover;width:100%;display:block;background:#000;cursor:pointer;}
  .video-tile{position:relative;}
  .video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:rgba(22,41,29,0.8);border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .video-play-btn .icon{width:18px;height:18px;color:var(--gold);margin-left:2px;}
  .plate-caption{font-size:0.72rem;color:var(--text-muted);font-style:italic;text-align:center;padding-top:0.4rem;}
  .empty-note{font-size:0.85rem;color:var(--text-muted);font-style:italic;grid-column:1/-1;text-align:center;padding:1rem 0;}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:1000;align-items:center;justify-content:center;touch-action:none;opacity:0;transition:opacity 0.28s ease;}
  .lightbox.open{display:flex;opacity:1;}
  .lightbox-img-wrap{max-width:92vw;max-height:82vh;display:flex;align-items:center;justify-content:center;transform-origin:center center;transition:transform 0.32s cubic-bezier(0.22,0.68,0,1.21);}
  @media(prefers-reduced-motion:reduce){
    .lightbox{transition:none;}
    .lightbox-img-wrap{transition:none !important;transform:none !important;}
  }
  .lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:4px;}
  .lightbox video{max-width:100%;max-height:82vh;border-radius:4px;}
  .lightbox-close{position:absolute;top:1rem;right:1rem;color:white;cursor:pointer;opacity:0.6;background:rgba(0,0,0,0.4);padding:8px;border-radius:4px;line-height:0;}
  .lightbox-close .icon{width:20px;height:20px;}
  .lightbox-close:hover{opacity:1;}
  .lightbox-share{position:absolute;top:1rem;right:3.75rem;color:white;cursor:pointer;opacity:0.6;background:rgba(0,0,0,0.4);padding:8px;border-radius:4px;line-height:0;}
  .lightbox-share .icon{width:20px;height:20px;}
  .lightbox-share:hover{opacity:1;}
  .lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);color:white;cursor:pointer;opacity:0.5;padding:1rem;line-height:0;}
  .lightbox-prev .icon,.lightbox-next .icon{width:30px;height:30px;}
  .lightbox-prev{left:0.25rem;}
  .lightbox-next{right:0.25rem;}
  .lightbox-prev:hover,.lightbox-next:hover{opacity:1;}
  .lightbox-counter{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-family:var(--serif-display);font-size:0.7rem;letter-spacing:3px;}
  .lightbox-caption{position:absolute;bottom:2.75rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-family:var(--serif-body);font-size:0.85rem;font-style:italic;}

  footer{background:#141f26;color:rgba(255,255,255,0.25);text-align:center;padding:1.5rem;font-family:var(--serif-display);font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;}
  footer span{color:var(--gold);}

  @media(max-width:640px){
    .gallery-grid{grid-template-columns:repeat(2,1fr);gap:1rem;}
  }
</style>
</head>

<script>
(function(){
  var SUPABASE_URL='https://ccczckdewwlpofgjigdi.supabase.co'; // confirmed project URL
  var SUPABASE_ANON_KEY='sb_publishable_9ZVOAL9qqv8uaLBq-DM_iA_ODMnweui'; // publishable key
  var BUCKET='bci-images';
  var EDITIONS=[
    {slug:'algarve-2027',gridId:'grid-algarve-2027'},
    {slug:'marbella-2026',gridId:'grid-marbella-2026'}
  ];
  // The original photos from before live uploads existed — always shown first, alongside anything submitted since.
  var STATIC_IMAGES={
    'algarve-2027':[
      {url:'images/course1.jpg',caption:'Quinta do Vale'},
      {url:'images/course2.jpg',caption:'Quinta do Vale'},
      {url:'images/course3.jpg',caption:'Isla Canela'},
      {url:'images/course4.jpg',caption:'Isla Canela'},
      {url:'images/hotel1.jpg',caption:'Vila Gale Tavira'}
    ],
    'marbella-2026':[
      {url:'images/photo1.jpeg',submittedBy:'Admin'},
      {url:'images/photo2.jpeg',submittedBy:'Admin'},
      {url:'images/photo3.jpeg',submittedBy:'Admin'},
      {url:'images/photo4.jpeg',submittedBy:'Admin'},
      {url:'images/photo5.jpeg',submittedBy:'Admin'},
      {url:'images/photo6.jpeg',submittedBy:'Admin'},
      {url:'images/photo7.jpeg',submittedBy:'Admin'}
    ]
  };
  var allImages=[]; // flattened, in the order rendered, for the lightbox to page through
  var current=0,touchStartX=0;

  document.getElementById('menu-btn').addEventListener('click',function(){
    document.getElementById('menu-btn').classList.toggle('open');
    document.getElementById('dropdown').classList.toggle('open');
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('#menu-btn')&&!e.target.closest('#dropdown')){
      document.getElementById('menu-btn').classList.remove('open');
      document.getElementById('dropdown').classList.remove('open');
    }
  });

  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(e,i){if(e.isIntersecting)setTimeout(function(){e.target.classList.add('visible');},i*80);});
  },{threshold:0.1});

  function fetchEdition(edition){
    return fetch(SUPABASE_URL+'/storage/v1/object/list/'+BUCKET,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({prefix:edition.slug+'/',limit:200,sortBy:{column:'created_at',order:'desc'}})
    }).then(function(res){return res.json();})
      .then(function(data){
        var items=Array.isArray(data)?data.filter(function(o){return o.name && o.name.indexOf('.')!==0 && o.name!=='.emptyFolderPlaceholder';}):[];
        return items.map(function(o){
          var mimetype=(o.metadata&&o.metadata.mimetype)||'';
          var isVideo=mimetype.indexOf('video')===0 || /\.(mp4|mov|webm|m4v)$/i.test(o.name);
          return {
            url:SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+edition.slug+'/'+o.name,
            isVideo:isVideo
          };
        });
      })
      .catch(function(){return null;});
  }

  function loadAllEditions(){
    var loaders=EDITIONS.map(function(ed){
      return fetchEdition(ed).then(function(fetched){
        var staticImgs=STATIC_IMAGES[ed.slug]||[];
        var combined = fetched===null
          ? (staticImgs.length ? staticImgs.slice() : null)
          : staticImgs.concat(fetched);
        return {edition:ed,images:combined};
      });
    });
    Promise.all(loaders).then(function(results){
      results.forEach(function(r){renderSection(r.edition,r.images);});
      wireUpImages();
    });
  }

  function renderSection(edition,images){
    var grid=document.getElementById(edition.gridId);
    if(images===null){
      grid.innerHTML='<p class="empty-note">Could not load images right now.</p>';
      return;
    }
    if(images.length===0){
      grid.innerHTML='<p class="empty-note">No photos uploaded yet for this edition.</p>';
      return;
    }
    grid.innerHTML=images.map(function(img){
      var hasCaption=!!img.caption;
      var altText=img.caption||'BCI photo';
      var media=img.isVideo
        ? '<div class="video-tile"><video class="gallery-vid" src="'+img.url+'#t=0.5" preload="metadata" muted playsinline webkit-playsinline></video><div class="video-play-btn"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></div></div>'
        : '<img class="gallery-img" src="'+img.url+'" alt="'+altText+'" loading="lazy" decoding="async"'+(hasCaption?' data-caption="'+img.caption+'"':'')+'>';
      return '<figure class="plate">'+
        '<div class="frame">'+media+'</div>'+
        (hasCaption?'<div class="plate-caption">'+img.caption+'</div>':'')+
      '</figure>';
    }).join('');
  }

  function wireUpImages(){
    var mediaEls=Array.from(document.querySelectorAll('.gallery-img, .video-tile'));
    var plates=Array.from(document.querySelectorAll('figure.plate'));

    allImages=mediaEls.map(function(el){
      if(el.classList.contains('video-tile')){
        var vid=el.querySelector('video');
        return {src:vid.src.replace(/#t=[\d.]+$/,''),caption:'',isVideo:true};
      }
      return {src:el.src,caption:el.dataset.caption,isVideo:false};
    });

    plates.forEach(function(el){observer.observe(el);});
    mediaEls.forEach(function(el,i){el.addEventListener('click',function(){openLightbox(i,el.getBoundingClientRect());});});
  }

  function openLightbox(i,fromRect){
    current=i;
    updateLightboxImage();
    var lb=document.getElementById('lightbox');
    var wrap=document.getElementById('lightbox-img-wrap')||document.querySelector('.lightbox-img-wrap');
    lb.classList.add('open');
    document.body.style.overflow='hidden';
    if(fromRect&&wrap&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      // Start the wrap exactly where the clicked thumbnail was, then let the
      // CSS transition above carry it out to its natural centred size —
      // a proper "grow from where you tapped it" rather than a straight fade.
      requestAnimationFrame(function(){
        var toRect=wrap.getBoundingClientRect();
        var scaleX=fromRect.width/toRect.width;
        var scaleY=fromRect.height/toRect.height;
        var fromCenterX=fromRect.left+fromRect.width/2;
        var fromCenterY=fromRect.top+fromRect.height/2;
        var toCenterX=toRect.left+toRect.width/2;
        var toCenterY=toRect.top+toRect.height/2;
        wrap.style.transition='none';
        wrap.style.transform='translate('+(fromCenterX-toCenterX)+'px,'+(fromCenterY-toCenterY)+'px) scale('+scaleX+','+scaleY+')';
        // force layout so the browser registers the starting transform
        // before switching the transition back on for the next frame
        wrap.getBoundingClientRect();
        requestAnimationFrame(function(){
          wrap.style.transition='';
          wrap.style.transform='';
        });
      });
    }
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow='';
    var video=document.getElementById('lightbox-video');
    video.pause();
    video.removeAttribute('src');
    video.load();
  }
  function updateLightboxImage(){
    var item=allImages[current];
    var imgEl=document.getElementById('lightbox-img');
    var videoEl=document.getElementById('lightbox-video');
    if(item.isVideo){
      imgEl.style.display='none';
      videoEl.style.display='block';
      videoEl.src=item.src;
      videoEl.currentTime=0;
      videoEl.play().catch(function(){});
    } else {
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      videoEl.style.display='none';
      imgEl.style.display='block';
      imgEl.src=item.src;
    }
    document.getElementById('lightbox-caption').textContent=item.caption||'';
    document.getElementById('lightbox-counter').textContent=(current+1)+' / '+allImages.length;
  }
  function changePhoto(dir){
    current=(current+dir+allImages.length)%allImages.length;
    updateLightboxImage();
  }

  document.getElementById('lightbox-close').addEventListener('click',closeLightbox);

  /* Real native share sheet — tries to share the actual photo/video file
     itself (so it shows up properly in the share sheet, not just a link),
     falling back to sharing the link if file-sharing isn't supported, and
     to copying the link if the Web Share API isn't available at all. */
  document.getElementById('lightbox-share').addEventListener('click',function(){
    var item=allImages[current];
    if(!item)return;
    var btn=this;
    var shareUrl=new URL(item.src,location.href).href;

    function shareLink(){
      if(navigator.share){
        navigator.share({title:'Book Club Invitational',url:shareUrl}).catch(function(){});
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(shareUrl).then(function(){
          var original=btn.innerHTML;
          btn.innerHTML='<svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>';
          setTimeout(function(){btn.innerHTML=original;},1400);
        }).catch(function(){});
      }
    }

    if(!navigator.share){shareLink();return;}

    fetch(item.src).then(function(r){return r.blob();}).then(function(blob){
      var ext=item.isVideo?'mp4':'jpg';
      var file=new File([blob],'bci-photo.'+ext,{type:blob.type||(item.isVideo?'video/mp4':'image/jpeg')});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Book Club Invitational'}).catch(function(){});
      } else {
        shareLink();
      }
    }).catch(shareLink);
  });
  document.getElementById('lightbox-prev').addEventListener('click',function(){changePhoto(-1);});
  document.getElementById('lightbox-next').addEventListener('click',function(){changePhoto(1);});
  document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===e.currentTarget)closeLightbox();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')changePhoto(-1);
    if(e.key==='ArrowRight')changePhoto(1);
  });
  document.getElementById('lightbox').addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX;},{passive:true});
  document.getElementById('lightbox').addEventListener('touchend',function(e){
    var diff=touchStartX-e.changedTouches[0].clientX;
    if(Math.abs(diff)>50)changePhoto(diff>0?1:-1);
  },{passive:true});

  loadAllEditions();
})();
</script>

<script src="live-tracker.js"></script>
<script src="bci-features.js"></script>
